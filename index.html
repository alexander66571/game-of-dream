<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <title>Игра Мечты</title>
	
	<style>
		#stage {
			position: absolute;
			left: 0px;
			top: 0px;
	
			width: 100vw;
			height: 100vh;


			background-image: url("img/background2.png");
			background-repeat: repeat repeat;
			background-size: 110%;
		}
		
		#picture {
			position: absolute;
			left: 0px;
			width: 50vw;
			scale: 60%;
			cursor: grab;
			touch-action: none;
			z-index: 1

		}
		
		#canvas_stage {
			position: absolute;
			top: 0px;
			left: 0px;
			width: 100vw;
			height: 100vh;
			z-index: 0;
		}
		
		<!--
			border: 5px solid #999;
			background-color: #777;
			
		
		
		#ground{
			position: absolute;
			top: 650px;
			left: 0px;
			width: 400px;
			border-top: 25px groove #090;
			background-color: #743;
			z-index: 1;
		}
		-->

	</style>
</head>

<body>
    <!-- Содержимое страницы -->
	
	<div id="stage">
		
		<img id="picture" src="img/persic.png">
		<canvas id="canvas_stage"></canvas>
		
	</div>
		
	

</body>

<script>
const picture = document.getElementById("picture");

const canvas = document.getElementById("canvas_stage");
const ctx = canvas.getContext("2d");

let cat, pipes, score, started, gameOver, frame;

var vw = window.screen.width;
var vh = window.screen.height;

function reset() {
  cat = {y: 230, vy: 0};
  pipes = [{top:10, x:400}];
  score = 0;
  started = false;
  gameOver = false;
  frame = 0;
  draw();
}

function action(){
	if(75 < cat.y){ 
		cat.vy = -4;
	}
}

function draw(){
	ctx.clearRect(0, 0, canvas.width, canvas.height);
	picture.style.top = `${cat.y-109}px`;
	
	
	for(const p of pipes){
		ctx.fillStyle = "#777";
		ctx.fillRect(p.x, 0, canvas.width*0.1, p.top);
		ctx.fillStyle = "#070";
		ctx.fillRect(p.x, p.top+canvas.height*0.35   , canvas.width*0.1, canvas.height-p.top-canvas.height*0.35);
		
	}
}
document.addEventListener("pointerdown", action);
document.addEventListener("keydown", e => {if (e.code === "Space") {action();}});


function update() {
	frame++;
	
	if(frame % 250 === 0){
	
	
	var top = parseInt(canvas.height*0.1 + Math.random() * 0.4*canvas.height);
	<!--console.log(top);-->
	pipes.push({top:top, x:vw});
	
	}

	cat.vy += 0.10;
    cat.y += cat.vy; 
	if(cat.y > 0.80*vh){action()}
	
	for(const p of pipes){
		p.x -= 0.7;
	}
	

	draw();
	<!--console.log(cat.y);-->
	requestAnimationFrame(update);
}
reset();
update();






</script>

</html>
